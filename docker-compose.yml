services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
      - "5665:5665"
      - "5666:5666"
      - "5667:5667"
    environment:
      - PORT=5000
      - INTERNAL_PORT=5665
      - INCOMING_PORT=5666
      - OUTGOING_PORT=5667
      - DB_USER=postgres
      - DB_PASSWORD=yourpassword
      - DB_HOST=postgres
      - DB_NAME=cdr_x_db
      - DOCKER_ENV=true
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: cdr_x_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5433:5432"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
